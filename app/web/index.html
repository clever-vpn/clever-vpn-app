<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>连接</title>
<link rel="stylesheet" href="app.css">
<script src="_brand.js"></script>
<script src="icons.js"></script>
<script src="bridge.js"></script>
<script src="api.js"></script>
<script src="ui.js"></script>
</head>
<!-- tab 根页面：没有返回；切页只走底部导航。状态在下面大圆钮那里，顶栏不重复。 -->
<body data-auth="in" data-studio-id="index">
<div class="page">

  <header class="topbar">
    <h1 data-brand-name></h1>
    <a class="nav-btn end" href="settings.html" aria-label="设置" data-studio-id="index.settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
    </a>
  </header>

  <div id="subbar" aria-live="polite"></div>
  <div id="notice"></div>

  <section class="hero">
    <button class="pwr" id="pwr" data-s="disconnected" aria-label="连接" aria-pressed="false" data-studio-id="index.power">
      <span class="sweep" aria-hidden="true"></span>
      <span class="halo" aria-hidden="true"></span>
      <span class="halo d2" aria-hidden="true"></span>
      <span class="sheen" aria-hidden="true"></span>
      <span class="ring"></span>
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" aria-hidden="true"><path d="M12 3v9"/><path d="M6.3 6.5a8 8 0 1 0 11.4 0"/></svg>
    </button>

    <div class="state-row">
      <span class="state-label" id="label" data-studio-id="index.state">未连接</span>
      <span class="state-time" id="time" hidden>00:00:00</span>
    </div>

    <div class="stats" id="stats" hidden>
      <div class="stat">
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v13M6.5 12.5 12 18l5.5-5.5"/></svg>
        <b id="down">0 KB</b><span class="vh">下行</span>
      </div>
      <div class="stat">
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V6M6.5 11.5 12 6l5.5 5.5"/></svg>
        <b id="up">0 KB</b><span class="vh">上行</span>
      </div>
    </div>

    <a class="quick" id="quick" href="lines.html" data-studio-id="index.line">
      <span id="curLine" style="display:inline-flex;align-items:center;gap:8px"></span>
      <span class="chev">›</span>
    </a>
  </section>

  <div class="sec">最近使用</div>
  <div class="list" id="recent" role="radiogroup" aria-label="最近使用" data-studio-id="index.recent"></div>
</div>
<nav data-tabs="connect"></nav>

<script>
UI.page(function () {
  var $ = function (id) { return document.getElementById(id); };
  var state = null;
  var sub = null;
  var lines = [];
  var connError = null;
  var tick = null;
  var busy = false;

  function lineById(id) { return lines.filter(function (l) { return l.id === id; })[0]; }
  function savedLineId() { return Number(localStorage.getItem('app.line')) || 0; }
  function selectedLine() {
    if (state && state.line) return lineById(state.line.id) || { id: state.line.id, label: state.line.label, icon: null };
    return lineById(savedLineId()) || lines.filter(function (l) { return l.isDefault; })[0] || lines[0];
  }

  function paintSubbar() {
    var bar = $('subbar');
    if (!sub || !sub.tag) { bar.innerHTML = ''; return; }
    var tone = sub.tag_tone === 'warn' ? ' warn' : sub.tag_tone === 'success' ? ' ok'
      : sub.tag_tone === 'info' ? ' on' : sub.tag_tone === 'muted' ? '' : '';
    bar.innerHTML = '<div class="alert" style="margin-top:12px"><span class="pill small' + tone + '">' +
      UI.esc(sub.tag) + '</span><span class="note">' + UI.esc(sub.status_text || '') + '</span></div>';
  }

  function noticeAction(copy) {
    if (copy.href) return '<a class="act" href="' + copy.href + '">' + UI.esc(copy.action) + '</a>';
    if (copy.support) return '<button class="act" type="button" data-act="support">' + UI.esc(copy.action) + '</button>';
    return '<button class="act" type="button" data-act="retry">' + UI.esc(copy.action) + '</button>';
  }

  function paintNotice() {
    var box = $('notice');
    if (connError) {
      var copy = UI.errorCopy(connError);
      box.innerHTML = '<div class="alert bad" role="alert"><span><b>' + UI.esc(copy.title) + '</b> ' +
        UI.esc(copy.text) + '</span>' + noticeAction(copy) + '</div>';
    } else if (!sub) {
      box.innerHTML = '';
    } else if (sub.status === 'active') {
      box.innerHTML = '';
    } else if (sub.status === 'provisioning') {
      box.innerHTML = '<div class="alert"><span>' + UI.esc(sub.status_text || '正在开通') + '</span></div>';
    } else if (sub.status === 'none') {
      box.innerHTML = '<div class="alert"><span>订阅后即可连接</span><a class="act" href="plans.html">选择套餐</a></div>';
    } else {
      var acts = sub.reason === 'frozen'
        ? (UI.brand.links.support ? '<button class="act" type="button" data-act="support">联系客服</button>' : '')
        : '<a class="act" href="plans.html">' + (sub.reason === 'exhausted' ? '加流量' : '续费') + '</a>';
      box.innerHTML = '<div class="alert warn" role="status"><span>' + UI.esc(sub.status_text || '订阅不可用') +
        '</span>' + acts + '</div>';
    }
    box.querySelectorAll('[data-act]').forEach(function (b) {
      b.onclick = function () {
        var act = b.getAttribute('data-act');
        if (act === 'retry') toggle();
        if (act === 'support') UI.openLink(UI.brand.links.support);
      };
    });
  }

  function stopClock() { if (tick) { clearInterval(tick); tick = null; } }
  function startClock(since) {
    stopClock();
    var from = since || Date.now();
    var paint = function () { $('time').textContent = UI.duration((Date.now() - from) / 1000); };
    paint();
    tick = setInterval(paint, 1000);
  }

  function paintState(s) {
    state = s;
    var connected = s.status === 'connected';
    $('pwr').setAttribute('data-s', s.status === 'error' ? 'disconnected' : s.status);
    $('pwr').setAttribute('aria-pressed', String(connected));
    $('pwr').setAttribute('aria-label', connected ? '断开连接' : '连接');
    $('time').hidden = !connected;
    $('stats').hidden = !connected || (!s.bytesIn && !s.bytesOut);
    $('down').textContent = UI.bytes(s.bytesIn);
    $('up').textContent = UI.bytes(s.bytesOut);
    if (connected) { $('label').textContent = '已连接'; startClock(s.since); }
    else if (s.status === 'connecting') { $('label').textContent = '连接中…'; stopClock(); }
    else { $('label').textContent = '未连接'; stopClock(); }
    if (s.status === 'error' && s.error) connError = s.error.code;
    else if (s.status !== 'error') connError = connError && s.status === 'connected' ? null : connError;
    paintNotice();
    paintQuick();
    renderRecent();
  }

  function paintQuick() {
    var line = selectedLine();
    if (!line) { $('curLine').textContent = '选择线路'; return; }
    $('curLine').innerHTML = UI.lineIcon(line) + '<span class="quick-name">' + UI.esc(line.label) + '</span>';
  }

  function renderRecent() {
    var line = selectedLine();
    if (!line || !lines.length) { $('recent').innerHTML = '<div class="empty">线路加载中…</div>'; return; }
    var ordered = [line].concat(lines.filter(function (l) { return l.id !== line.id; })).slice(0, 3);
    $('recent').innerHTML = ordered.map(function (l, i) {
      var on = i === 0;
      return '<button class="row" data-pick="' + l.id + '" role="radio" aria-checked="' + on + '">' +
        UI.lineIcon(l) + '<span class="grow">' + UI.esc(l.label) + '</span>' +
        '<span class="val" title="流量系数">x' + (l.factor || 1) + '</span>' +
        (on ? '<span class="chk"><svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS.check + '</svg></span>' : '') +
        '</button>';
    }).join('');
    $('recent').querySelectorAll('[data-pick]').forEach(function (b) {
      b.onclick = function () { pick(Number(b.getAttribute('data-pick'))); };
    });
  }

  async function setLine(id) {
    try {
      await bridge.setLine(id);
      localStorage.setItem('app.line', String(id));
      paintQuick();
      renderRecent();
    } catch (e) {
      UI.toast(UI.errText(e, '切换线路失败'), 'bad');
    }
  }

  async function pick(id) {
    var line = selectedLine();
    if (line && id === line.id) return;
    var target = lineById(id);
    if (!target) return;
    var st = state || { status: 'disconnected' };
    if (st.status === 'connecting') return;              // 别打断半截状态
    if (st.status !== 'connected') { await setLine(id); return; }
    var yes = await UI.confirm({ title: '切换到 ' + target.label, message: '当前连接会断开。', ok: '切换' });
    if (!yes) return;
    try {
      await bridge.disconnect();
      await setLine(id);
    } catch (e) {
      UI.toast(UI.errText(e, '切换失败'), 'bad');
    }
  }

  async function toggle() {
    if (busy) return;
    var st = state || { status: 'disconnected' };
    if (st.status === 'connected' || st.status === 'connecting') {
      busy = true;
      try { await bridge.disconnect(); } catch (e) { /* state() 才是真相 */ }
      busy = false;
      return;
    }
    if (sub && sub.status !== 'active') { location.href = 'plans.html'; return; }
    busy = true;
    connError = null;
    paintNotice();
    try {
      var s = await bridge.state();
      // 线路归壳管：先把 UI 记着的那条交给壳，再激活/连接（顺序与 BRIDGE.md §1 一致）
      var chosen = selectedLine();
      if (!s.line && chosen && chosen.id) await bridge.setLine(chosen.id);
      if (!s.activated && sub && sub.code) await bridge.activate(sub.code);  // code 不展示、不记录
      await bridge.connect();
      paintState(await bridge.state());
    } catch (e) {
      connError = (e && e.code) || 'INTERNAL';
      paintState(await bridge.state().catch(function () { return st; }));
    } finally {
      busy = false;
    }
  }

  $('pwr').onclick = toggle;

  bridge.on('state', paintState);

  bridge.state().then(paintState).catch(function () { paintNotice(); });

  bridge.lines().then(function (res) {
    lines = (res && res.lines) || [];
    if (!lines.length) {
      $('recent').innerHTML = '<div class="empty"><b>暂无可用线路</b>稍后刷新，或联系客服。</div>';
      return;
    }
    paintQuick();
    renderRecent();
  }).catch(function () {
    $('recent').innerHTML = '<div class="empty"><b>线路加载失败</b>检查网络后重试。</div>';
  });

  Api.subscription().then(function (s) {
    sub = s;
    paintSubbar();
    paintNotice();
  }).catch(function (e) {
    if (e.status === 401) { location.replace('login.html'); return; }
    // CRM 不可达：不挡已激活的隧道，只提示（契约 §6）
    if (!connError) {
      $('notice').innerHTML = '<div class="alert"><span>暂时无法加载订阅信息</span>' +
        '<button class="act" type="button" id="reloadSub">重试</button></div>';
      var b = document.getElementById('reloadSub');
      if (b) b.onclick = function () { location.reload(); };
    }
  });
});
</script>
</body>
</html>
