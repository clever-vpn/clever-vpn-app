# 上游模板维护门禁：只在上游仓库跑；fork 里跳过。
# 公共检查逻辑在 scripts/ 里；这里保留稳定 job 名 validate / web-contract / web-smoke。
name: template-validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'clever-vpn/clever-vpn-app'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: 校验 app/app.json / app.lock.json / 图标 / logo
        run: node scripts/build.mjs --check
      - name: 闸门与构建脚本自检（纯函数 fixtures）
        run: node --test "test/*.test.mjs"

  web-contract:
    name: web-contract
    if: github.repository == 'clever-vpn/clever-vpn-app'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: 校验 web/ 契约（与 studio 的 check_draft 同一份实现）
        run: node scripts/check-web.mjs --report web-contract-report.json
      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-contract-report
          path: web-contract-report.json
          if-no-files-found: warn
          retention-days: 14

  path-whitelist:
    name: path-whitelist
    if: github.repository == 'clever-vpn/clever-vpn-app'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: 上游分支只提示（人工/上游可改任意路径）
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: node scripts/check-paths.mjs --base "origin/$BASE" --head HEAD

  web-smoke:
    name: web-smoke
    if: github.repository == 'clever-vpn/clever-vpn-app'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 安装测试依赖
        run: npm ci
      - name: 生成 web/_brand.js 与品牌标记（构建产物，不入库）
        run: node scripts/build.mjs
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium
      - name: 行为冒烟（假壳 + 真实 Chromium，10 页 × 视口 × 主题 + 品牌替换）
        run: npx playwright test
      - name: 上传报告与截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
