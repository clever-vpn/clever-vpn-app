# PR 门禁：brand.json / web 静态契约 / web 行为冒烟
name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同一分支的新提交取消旧跑，省租户的 Actions 分钟数
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: 校验 brand.json 与 web
        run: node scripts/build.mjs --check

  web-contract:
    name: web-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: 校验 web/ 契约
        run: node scripts/check-web.mjs --report web-contract-report.json
      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-contract-report
          path: web-contract-report.json
          if-no-files-found: warn
          retention-days: 14

  web-smoke:
    name: web-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 安装测试依赖
        run: npm ci
      - name: 生成 web/_brand.js（构建产物，不入库）
        run: node scripts/build.mjs
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium
      - name: 行为冒烟（假壳 + 真实 Chromium）
        run: npx playwright test
      - name: 上传报告与截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
