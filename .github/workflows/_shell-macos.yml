# macOS 壳：可被 release.yml 调用（workflow_call），也可单独 dispatch 做构建验收。
#
# - workflow_call：用发布流程产出的 web-dist
# - workflow_dispatch：自己先跑 node scripts/build.mjs
# 有 APPLE_CERT_P12_BASE64 时签名 + 公证；没有就出未签名 DMG（只用于构建/功能验收）。
name: shell-macos

on:
  workflow_call:
    inputs:
      tag:
        description: '发布 tag（含 v 前缀）'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: '本地调试用的版本标签（含 v 前缀）'
        type: string
        required: false
        default: 'v0.0.0-dev'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: 安装 xcodegen
        run: brew install xcodegen

      - name: 生成 dist/（仅手动 dispatch）
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/build.mjs

      - name: 取发布流程的 dist/
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: 出包（SwiftPM 单测 → archive → DMG → 公证）
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROFILE_APP_BASE64: ${{ secrets.APPLE_PROFILE_APP_BASE64 }}
          APPLE_PROFILE_SYSEXT_BASE64: ${{ secrets.APPLE_PROFILE_SYSEXT_BASE64 }}
          APPLE_ASC_KEY_ID: ${{ secrets.APPLE_ASC_KEY_ID }}
          APPLE_ASC_ISSUER_ID: ${{ secrets.APPLE_ASC_ISSUER_ID }}
          APPLE_ASC_KEY_P8_BASE64: ${{ secrets.APPLE_ASC_KEY_P8_BASE64 }}
        run: bash shells/macos/ci/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: shells/macos/ci/out/
          if-no-files-found: error
          retention-days: 7
